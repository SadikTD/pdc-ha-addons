<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editorial Monitor</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <span class="logo" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></span>
        <span class="brand-text"><strong>Editorial Monitor</strong><span>Gamurs syndication desk</span></span>
      </div>
      <nav aria-label="Pages" id="nav" class="nav"></nav>
      <div class="side-foot" id="side-foot"></div>
    </aside>
    <main class="content"><div class="page" id="main" tabindex="-1"><p class="loading" role="status">Loading the desk</p></div></main>
  </div>
  <div class="scrim" id="scrim" hidden></div>
  <aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" hidden></aside>
  <div class="sr-only" aria-live="polite" id="live"></div>
  <script src="app.js"></script>
</body>
</html>
