name: Net Monitor
version: "1.3.0"
slug: net_monitor
description: Hourly international speedtest and internet outage tracker
url: https://github.com/SadikTD/pdc-ha-addons/tree/main/net_monitor
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
# Host networking lets the add-on see the router over UPnP (to skip speedtests
# while the line is busy) and test the real LAN path, not Docker's NAT.
host_network: true
ingress: true
ingress_port: 38765
panel_icon: mdi:speedometer
panel_title: Net Monitor
# Publishes sensors, sends notifications and drives Alexa announcements.
homeassistant_api: true
# Read-only: looks up the PDC WhatsApp Bridge add-on's internal IP for outage reports.
hassio_api: true
options:
  speedtest_interval_minutes: 60
  # Best-routed Singapore Ookla servers from Bangladesh (Indosat, Firstmedia,
  # Symphony, FPT). Singtel/M1 routes were heavily congested in testing.
  server_ids:
    - 13058
    - 7556
    - 62530
    - 67827
  check_interval_seconds: 30
  # International hosts only (Singapore + Cloudflare). 8.8.8.8 / 9.9.9.9 are
  # served from in-country caches and would hide an international outage.
  check_targets:
    - sgp-ping.vultr.com:443
    - m1speedtest1.m1net.com.sg:8080
    - speedtest.singnet.com.sg:8080
    - 1.1.1.1:443
  # The line counts as busy (test postponed) if ANY of these is exceeded. Gaming and
  # calls use little bandwidth, so upload and outgoing packet rate catch them.
  busy_threshold_mbps: 5
  busy_upload_mbps: 0.25
  busy_packets_per_second: 40
  busy_retry_minutes: 10
  recovery_speedtest_min_outage_minutes: 2
  notify_service: ""
  notify_min_outage_minutes: 1
  retention_days: 365
  plan_download_mbps: 40
  plan_upload_mbps: 40
  slow_alert_percent: 50
  slow_alert_consecutive_tests: 2
  weekly_report_enabled: true
  weekly_report_day: sun
  weekly_report_hour: 21
  quality_samples: 5
  # Daily windows (local time) when the router restarts on schedule, e.g. "02:58-03:10".
  # Outages inside them aren't counted, alerted or followed by a speedtest.
  maintenance_windows: []
  # Echo devices (Alexa Media Player) that announce when the internet drops and returns.
  alexa_entities: []
  alexa_volume: 60
  alexa_down_message: "Warning! The internet is down right now."
  # {duration} becomes e.g. "27 minutes".
  alexa_up_message: "Good news! The internet is back. It was down for {duration}."
  # No announcements in these daily windows, e.g. "00:00-07:30".
  alexa_quiet_hours: []
  # Alexa can't speak without internet. If Amazon is unreachable, the "down" warning
  # is spoken by this phone instead, e.g. notify.mobile_app_my_phone.
  offline_tts_service: ""
  # Outage report over the PDC WhatsApp Bridge add-on (same api_token as the bridge).
  whatsapp_to: ""
  whatsapp_api_token: ""
  # Only needed if the bridge can't be found automatically, e.g. http://172.30.33.6:8787
  whatsapp_bridge_url: ""
  # ISP report card for the previous month, over WhatsApp on the 1st.
  monthly_report_enabled: true
  monthly_report_hour: 10
  # Monthly bill, for the report's value-for-money line (0 = leave it out).
  plan_price: 0
  plan_currency: "৳"
schema:
  speedtest_interval_minutes: int(15,1440)
  server_ids:
    - int
  check_interval_seconds: int(10,300)
  check_targets:
    - match(^[A-Za-z0-9.\-]+:\d{1,5}$)
  busy_threshold_mbps: float(0,10000)
  busy_upload_mbps: float(0,10000)
  busy_packets_per_second: int(0,100000)
  busy_retry_minutes: int(1,60)
  recovery_speedtest_min_outage_minutes: int(0,1440)
  notify_service: str?
  notify_min_outage_minutes: int(0,1440)
  retention_days: int(7,3650)
  plan_download_mbps: float(1,100000)
  plan_upload_mbps: float(1,100000)
  slow_alert_percent: int(0,100)
  slow_alert_consecutive_tests: int(1,24)
  weekly_report_enabled: bool
  weekly_report_day: list(mon|tue|wed|thu|fri|sat|sun)
  weekly_report_hour: int(0,23)
  quality_samples: int(1,10)
  maintenance_windows:
    - match(^\d{1,2}:\d{2}-\d{1,2}:\d{2}$)
  alexa_entities:
    - match(^media_player\.[a-z0-9_]+$)
  alexa_volume: int(0,100)
  alexa_down_message: str
  alexa_up_message: str
  alexa_quiet_hours:
    - match(^\d{1,2}:\d{2}-\d{1,2}:\d{2}$)
  offline_tts_service: str?
  whatsapp_to: match(^(\+[1-9]\d{7,14})?$)?
  whatsapp_api_token: password?
  whatsapp_bridge_url: str?
  monthly_report_enabled: bool
  monthly_report_hour: int(0,23)
  plan_price: float(0,10000000)
  plan_currency: str
