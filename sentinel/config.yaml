name: Sentinel
version: "1.23.4"
slug: sentinel
description: Reliable 24/7 camera recorder (NVR) with motion detection and a modern UI
url: https://github.com/SadikTD/pdc-ha-addons/tree/main/sentinel
# Built on GitHub (.github/workflows/sentinel-image.yml) and downloaded by the
# Supervisor: updating no longer compiles on the Pi next to recording and Home
# Assistant. Push, wait for the "Sentinel image" run to finish, then update.
image: "ghcr.io/sadiktd/{arch}-sentinel"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:cctv
panel_title: Sentinel
# Host network: the Sentinel app connects over UDP 8555 (QUIC, end-to-end encrypted,
# only app users can log in); Docker's NAT in between would break NAT hole punching.
# The panel port 8099 only answers Home Assistant (see panelOnly).
host_network: true
# Motion/recording sensors and snapshot cameras via the Mosquitto add-on (optional).
services:
  - mqtt:want
# Outage alerts through notify.* and persistent notifications.
homeassistant_api: true
hassio_api: true
map:
  # Settings (sentinel.json) live in /addon_configs/<slug>/ and are included in backups.
  - type: addon_config
    read_only: false
  # Recordings go to /media/sentinel, which backups skip.
  - type: media
    read_only: false
  # Only to install the dashboard card as /config/www/sentinel/sentinel-card.js.
  - type: homeassistant_config
    read_only: false
# The Supervisor restarts Sentinel if its main loop or any recorder loop gets stuck.
watchdog: http://[HOST]:[PORT:8099]/api/health
# Time for ffmpeg to close the current recording cleanly on stop.
timeout: 20
# Everything is configured on the add-on's own Settings page.
options: {}
schema: {}
