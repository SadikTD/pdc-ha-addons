name: PDC Monitor
version: "3.11.0"
slug: pdc_whatsapp
description: Pitch Duplicate Checker monitor for WGTC (Trello), AotF (Google Sheet) and OS (Asana) with Slack alerts, WhatsApp for monitor problems, and a sidebar dashboard
url: https://github.com/SadikTD/pdc-ha-addons/tree/main/pdc_whatsapp
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
# Sidebar dashboard: pitch checks, verdicts, messages, settings.
ingress: true
ingress_port: 8099
panel_icon: mdi:shield-search
panel_title: PDC Monitor
# Lets the bridge raise Home Assistant notifications when WhatsApp is unlinked or offline.
homeassistant_api: true
# Saves this add-on's own options (and restarts it) from the dashboard's Settings page.
hassio_api: true
# No host port is published. The pitch monitor only makes outbound requests
# (Trello, MiMo/Gemini); local add-ons (Sentinel) reach :8787 on the Supervisor network.
ports:
  8787/tcp: null
options:
  api_token: ""
  sender_number: ""
  recipient_number: ""
  ha_notifications: true
  offline_notify_minutes: 10
  # Before the monitor has moved here: WhatsApp the recipient when the
  # Worker's alert outbox has been unreachable this long. 0 turns it off.
  upstream_alert_minutes: 15
  # The pitch-checker Worker, e.g. https://name.account.workers.dev. The pitch
  # monitor moves from it to this add-on on first start (signs in with api_token).
  worker_url: ""
  # Asana personal access token for the OS monitor (read-only use). Can also be
  # set from PDC Monitor > Settings.
  asana_token: ""
  # WhatsApp group for PDC alerts (its id, e.g. 1203...@g.us); empty sends them
  # to recipient_number. Easiest to pick in PDC Monitor > Settings.
  alert_group: ""
  # Slack Incoming Webhook (https://hooks.slack.com/services/...). Empty sends
  # everything to WhatsApp. Easiest in PDC Monitor > Settings.
  slack_webhook_url: ""
  # Optional channel per site (Slack webhooks too); empty uses slack_webhook_url.
  slack_webhook_wgtc: ""
  slack_webhook_aotf: ""
  slack_webhook_os: ""
  # Sites whose messages may go to Slack (comma list of wgtc,aotf,os).
  slack_sites: "wgtc,aotf,os"
  # Where each kind of message goes: slack, whatsapp or both.
  route_duplicates: slack
  route_problems: whatsapp
  route_connection: whatsapp
schema:
  api_token: password
  sender_number: match(^\+[1-9]\d{7,14}$)
  recipient_number: match(^\+[1-9]\d{7,14}$)
  ha_notifications: bool
  offline_notify_minutes: int(1,1440)
  upstream_alert_minutes: int(0,1440)?
  worker_url: match(^(https://[A-Za-z0-9.-]+(:\d+)?/?)?$)?
  asana_token: password?
  alert_group: match(^([0-9-]{5,40}@g\.us)?$)?
  slack_webhook_url: password?
  slack_webhook_wgtc: password?
  slack_webhook_aotf: password?
  slack_webhook_os: password?
  slack_sites: match(^[a-z,]*$)?
  route_duplicates: list(slack|whatsapp|both)?
  route_problems: list(slack|whatsapp|both)?
  route_connection: list(slack|whatsapp|both)?
