# Builds the Sentinel add-on image on GitHub (so updating on the Pi is a download, not
# minutes of compiling next to recording and Home Assistant) and publishes it as
# ghcr.io/sadiktd/{arch}-sentinel:{version}, which sentinel/config.yaml points at.
name: Sentinel image

on:
  push:
    branches: [main]
    paths: ["sentinel/**", ".github/workflows/sentinel-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sentinel-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: echo "version=$(sed -n 's/^version: "\(.*\)"/\1/p' sentinel/config.yaml)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: sentinel
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.v.outputs.version }}
          labels: |
            io.hass.name=Sentinel
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.source=https://github.com/SadikTD/pdc-ha-addons
          tags: |
            ghcr.io/sadiktd/${{ matrix.arch }}-sentinel:${{ steps.v.outputs.version }}
            ghcr.io/sadiktd/${{ matrix.arch }}-sentinel:latest
          cache-from: type=gha,scope=sentinel-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=sentinel-${{ matrix.arch }}
